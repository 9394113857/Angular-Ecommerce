steps:
  - name: 🚀 Start Live Backend Monitoring Dashboard
    shell: bash
    env:
      DURATION_MINUTES: ${{ inputs.duration_minutes }}
    run: |
      set -uo pipefail

      # ==========================================================
      # 🌈 ANGULAR E-COMMERCE | LIVE BACKEND CONTROL CENTER
      # ==========================================================

      # ----------------------------------------------------------
      # 🎨 ANSI COLOR CONFIGURATION
      # ----------------------------------------------------------

      RESET=$'\033[0m'
      BOLD=$'\033[1m'
      DIM=$'\033[2m'

      RED=$'\033[91m'
      ORANGE=$'\033[38;5;208m'
      YELLOW=$'\033[93m'
      GREEN=$'\033[92m'
      LIME=$'\033[38;5;118m'
      CYAN=$'\033[96m'
      BLUE=$'\033[94m'
      PURPLE=$'\033[95m'
      MAGENTA=$'\033[38;5;201m'
      WHITE=$'\033[97m'
      GREY=$'\033[90m'

      # ----------------------------------------------------------
      # ⚙️ SESSION CONFIGURATION
      # ----------------------------------------------------------

      if ! [[ "$DURATION_MINUTES" =~ ^[0-9]+$ ]] ||
         (( DURATION_MINUTES < 1 || DURATION_MINUTES > 360 )); then
        echo "ERROR: Duration must be between 1 and 360 minutes."
        exit 1
      fi

      INTERVAL=300
      DURATION=$((DURATION_MINUTES * 60))

      START=$(date +%s)
      DEADLINE=$((START + DURATION))

      ROUND=0
      SUCCESS=0
      FAILED=0

      TOTAL_SERVICES=6

      SERVICES=(
        "AUTH"
        "PRODUCT"
        "CART / ORDER"
        "ML EVENTS"
        "ML RECOMMENDATIONS"
        "ASSISTANT"
      )

      URLS=(
        "https://backend-auth-service-ks6f.onrender.com"
        "https://backend-product-service-ncl2.onrender.com"
        "https://backend-cart-order-service-q6qh.onrender.com"
        "https://backend-ml-events-service-ba9v.onrender.com"
        "https://backend-ml-recommendation-service-huu6.onrender.com"
        "https://assistant-service-g24j.onrender.com/"
      )

      STATUS=(
        "WAITING"
        "WAITING"
        "WAITING"
        "WAITING"
        "WAITING"
        "WAITING"
      )

      LAST_CHECK=(
        "NOT CHECKED"
        "NOT CHECKED"
        "NOT CHECKED"
        "NOT CHECKED"
        "NOT CHECKED"
        "NOT CHECKED"
      )

      HTTP_CODES=(
        "---" "---" "---" "---" "---" "---"
      )

      # ----------------------------------------------------------
      # ⏱️ INDIVIDUAL BACKEND TIMER INITIALIZATION
      #
      # Each backend records its own first request timestamp.
      # This timestamp is NEVER reset during later rounds.
      # ----------------------------------------------------------

      SERVICE_STARTS=(
        0 0 0 0 0 0
      )

      RESULT_DIR=$(mktemp -d)

      cleanup() {
        rm -rf "$RESULT_DIR"
      }

      trap cleanup EXIT

      # ----------------------------------------------------------
      # 🌈 DYNAMIC COLOR ENGINE
      #
      # Session begins GREEN.
      # Colors progressively change with elapsed time.
      # Final five minutes become RED.
      # ----------------------------------------------------------

      get_dynamic_color() {

        local NOW="$1"
        local REMAINING=$((DEADLINE - NOW))
        local ELAPSED=$((NOW - START))

        local ALERT_WINDOW=300

        if (( DURATION <= 300 )); then
          ALERT_WINDOW=$((DURATION / 5))
          (( ALERT_WINDOW < 1 )) && ALERT_WINDOW=1
        fi

        if (( REMAINING <= ALERT_WINDOW )); then
          printf '%s' "$RED"
          return
        fi

        local LEVEL=$((ELAPSED * 7 / DURATION))

        local COLORS=(
          "$GREEN"
          "$LIME"
          "$CYAN"
          "$BLUE"
          "$PURPLE"
          "$MAGENTA"
          "$ORANGE"
          "$RED"
        )

        (( LEVEL > 7 )) && LEVEL=7

        printf '%s' "${COLORS[$LEVEL]}"
      }

      # ----------------------------------------------------------
      # ⏱️ TIME FORMATTING
      # ----------------------------------------------------------

      format_time() {

        local SECONDS_VALUE="$1"

        if (( SECONDS_VALUE < 0 )); then
          SECONDS_VALUE=0
        fi

        local HOURS=$((SECONDS_VALUE / 3600))
        local MINUTES=$(((SECONDS_VALUE % 3600) / 60))
        local SECONDS=$((SECONDS_VALUE % 60))

        printf "%02d:%02d:%02d" \
          "$HOURS" "$MINUTES" "$SECONDS"
      }

      current_ist() {
        TZ=Asia/Kolkata date '+%d-%b-%Y %I:%M:%S %p IST'
      }

      # ==========================================================
      # 📊 MASTER DASHBOARD
      # ==========================================================

      print_master_dashboard() {

        local NOW
        NOW=$(date +%s)

        local REMAINING=$((DEADLINE - NOW))
        (( REMAINING < 0 )) && REMAINING=0

        # Overall elapsed time for the complete six-backend session.
        local TOTAL_ELAPSED=$((NOW - START))
        (( TOTAL_ELAPSED < 0 )) && TOTAL_ELAPSED=0
        (( TOTAL_ELAPSED > DURATION )) && TOTAL_ELAPSED=$DURATION

        local NEXT_LEFT=0

        if (( ROUND > 0 )); then
          NEXT_LEFT=$((NEXT_WAKEUP - NOW))
          (( NEXT_LEFT < 0 )) && NEXT_LEFT=0
        fi

        local COLOR
        COLOR=$(get_dynamic_color "$NOW")

        local ONLINE=0
        local DOWN=0

        for i in "${!STATUS[@]}"; do
          if [[ "${STATUS[$i]}" == "ONLINE" ]]; then
            ONLINE=$((ONLINE + 1))
          elif [[ "${STATUS[$i]}" == "FAILED" ]]; then
            DOWN=$((DOWN + 1))
          fi
        done

        local NEXT_TIME="WAITING FOR FIRST ROUND"

        if (( ROUND > 0 )); then
          NEXT_TIME=$(TZ=Asia/Kolkata date \
            -d "@$NEXT_WAKEUP" '+%I:%M:%S %p IST')
        fi

        echo ""
        echo -e "${COLOR}${BOLD}"
        echo "╔══════════════════════════════════════════════════════════╗"
        echo "║          🌈 ANGULAR E-COMMERCE CONTROL CENTER            ║"
        echo "║                  LIVE MASTER DASHBOARD                  ║"
        echo "╚══════════════════════════════════════════════════════════╝"
        echo -e "${RESET}"

        printf "${WHITE}%-25s${RESET} %s\n" \
          "📅 CURRENT IST:" "$(current_ist)"

        printf "${WHITE}%-25s${RESET} %s\n" \
          "⏱️ TOTAL DURATION:" "$(format_time "$DURATION")"

        printf "${COLOR}%-25s %s${RESET}\n" \
          "⌛ SESSION REMAINING:" "$(format_time "$REMAINING")"

        printf "${CYAN}%-25s %s\n" \
          "⏱️ TOTAL ELAPSED (ALL 6):" "$(format_time "$TOTAL_ELAPSED")"

        printf "${CYAN}%-25s %s\n" \
          "🔄 CURRENT ROUND:" "$ROUND"

        printf "${GREEN}%-25s %s\n" \
          "🟢 ONLINE SERVICES:" "$ONLINE / $TOTAL_SERVICES"

        printf "${RED}%-25s %s\n" \
          "🔴 FAILED SERVICES:" "$DOWN / $TOTAL_SERVICES"

        printf "${GREEN}%-25s %s\n" \
          "✅ TOTAL SUCCESSFUL:" "$SUCCESS"

        printf "${RED}%-25s %s\n" \
          "❌ TOTAL FAILED:" "$FAILED"

